---
name: Comment when event attended
on:
  projects_v2_item:
    types:
      - edited
permissions:
  issues: write
  contents: read
  repository-projects: read
jobs:
  comment-on-attended:
    runs-on: ubuntu-latest
    steps:
      - name: Check status and comment
        uses: actions/github-script@v7
        with:
          script: >
            const ITEM = context.payload.projects_v2_item;

            const itemNodeId = ITEM.node_id;


            const query = `
              query ($item: ID!) {
                node(id: $item) {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        number
                        repository {
                          name
                          owner { login }
                        }
                      }
                    }
                    fieldValues(first: 20) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;


            const result = await github.graphql(query, {
              item: itemNodeId
            });


            const item = result.node;

            if (!item || !item.content) return;


            const issue = item.content;


            const statusField = item.fieldValues.nodes.find(
              f => f.field && f.field.name === "Status"
            );


            if (!statusField || statusField.name !== "Attended") {
              console.log("Not attended.");
              return;
            }


            const owner = issue.repository.owner.login;

            const repo = issue.repository.name;

            const issue_number = issue.number;


            const marker = "<!-- attended-comment -->";

            const message = `${marker} Thank you for attending the event. Please fill out this form: https://4tvhy.share.hsforms.com/2jHn33dUtSlGGKp8_y6WIOw`;


            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });


            const alreadyPosted = comments.data.some(c =>
              c.body.includes(marker)
            );


            if (alreadyPosted) {
              console.log("Already commented.");
              return;
            }


            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: message,
            });


            console.log("Comment posted.");
