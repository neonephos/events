---
name: Comment when event attended
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: null
permissions:
  issues: write
  contents: read
  repository-projects: read
jobs:
  check-attended:
    runs-on: ubuntu-latest
    steps:
      - name: Run script
        uses: actions/github-script@v7
        with:
          script: >
            const PROJECT_NUMBER = 8; // <-- change this!


            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  projectV2(number: $number) {
                    items(first: 50) {
                      nodes {
                        content {
                          ... on Issue {
                            number
                            repository {
                              name
                              owner { login }
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;


            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: PROJECT_NUMBER
            });


            const items = result.repository.projectV2.items.nodes;


            for (const item of items) {
              if (!item.content) continue;

              const issue = item.content;

              const statusField = item.fieldValues.nodes.find(
                f => f.field && f.field.name === "Status"
              );

              if (!statusField || statusField.name !== "Attended") continue;

              const owner = issue.repository.owner.login;
              const repo = issue.repository.name;
              const issue_number = issue.number;

              const marker = "<!-- attended-comment -->";
              const message = `${marker} Thank you for attending the event. Please fill out this form: https://4tvhy.share.hsforms.com/2jHn33dUtSlGGKp8_y6WIOw`;

              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
              });

              const alreadyPosted = comments.data.some(c =>
                c.body.includes(marker)
              );

              if (alreadyPosted) {
                console.log(`Already commented on #${issue_number}`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message,
              });

              console.log(`Commented on #${issue_number}`);
            }
